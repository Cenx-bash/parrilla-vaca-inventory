<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage · Parrilla Vaca Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="usage">

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="eyebrow">Stock out</p>
        <h1>Usage</h1>
        <p class="sub">Kitchen prep, wastage, spoilage, and staff meals.</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--gold" id="newUsage" type="button">Record usage</button>
      </div>
    </header>

    <section class="card">
      <div class="filters">
        <input class="input" type="date" id="filterFrom">
        <span class="muted" style="font-size:12px">to</span>
        <input class="input" type="date" id="filterTo">
        <select class="input" id="filterItem">
          <option value="">All items</option>
        </select>
        <select class="input" id="filterReason">
          <option value="">All reasons</option>
        </select>
        <button class="btn btn--ghost" id="clearFilters" type="button">Clear</button>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Date</th>
              <th>Item</th>
              <th class="num">Qty</th>
              <th>Reason</th>
              <th>Recorded by</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="usageBody">
            <tr><td colspan="6" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>
<script src="https://unpkg.com/lucide@0.414.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
