<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suppliers · Parrilla Vaca Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="suppliers">

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="eyebrow">Contacts</p>
        <h1>Suppliers</h1>
        <p class="sub">Who we order from, and how to reach them.</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--gold" id="newSupplier" type="button">Add supplier</button>
      </div>
    </header>

    <section class="card">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Name</th>
              <th>Contact</th>
              <th>Category</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="supplierBody">
            <tr><td colspan="4" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>
<script src="https://unpkg.com/lucide@0.414.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
