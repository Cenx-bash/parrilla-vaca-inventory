<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · Parrilla Vaca Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reports">

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="eyebrow">Management</p>
        <h1>Reports</h1>
        <p class="sub">Stock movement, day by day.</p>
      </div>
    </header>

    <section class="card mb-16">
      <div class="filters" style="margin-bottom:0">
        <input class="input" type="date" id="reportFrom">
        <span class="muted" style="font-size:12px">to</span>
        <input class="input" type="date" id="reportTo">
        <button class="btn btn--gold" id="runReport" type="button">Run report</button>
      </div>
    </section>

    <section class="card">
      <header class="card__head">
        <h2>Deliveries vs. usage</h2>
        <span class="muted" style="font-size:12px">Entry counts per day</span>
      </header>
      <div class="movement" id="movementChart"></div>
    </section>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>
<script src="https://unpkg.com/lucide@0.414.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
